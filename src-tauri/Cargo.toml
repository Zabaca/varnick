[package]
name = "varnick"
version = "0.0.0"
description = "A desktop harness for a coding agent"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "varnick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stopping the agent means stopping its whole tree — the wrapper's bash,
# sandbox-exec, the agent host and the Claude Code process under it — so the
# kill is sent to a process group rather than a pid. `kill(2)` with a negative
# pid is the only way to say that, and std does not expose it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Preview dialog, drawn by this process.
#
# A Preview whose Worktree edits the Fence is the one path from confined to
# unconfined, and the dialog is what stands in it — so it must be a thing
# Userspace cannot draw. Userspace renders in the same window and the agent
# writes Userspace freely, so anything the webview could paint could be forged
# and the developer trained to click through; an NSAlert removes the class
# rather than mitigating it. See docs/adr/0014-core-is-authored-in-a-worktree.md.
#
# These are already in this build's dependency graph — tauri's macOS backend
# pulls the same versions — so naming them costs nothing at compile time and
# gains a dialog with a scrolling accessory view, which is what showing hunks
# rather than a summary needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSFont",
    "NSResponder",
    "NSScrollView",
    "NSText",
    "NSTextView",
    "NSView",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
