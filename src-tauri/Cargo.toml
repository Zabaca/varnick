[package]
name = "varnick"
version = "0.0.0"
description = "A desktop harness for a coding agent"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "varnick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stopping the agent means stopping its whole tree — the wrapper's bash,
# sandbox-exec, the agent host and the Claude Code process under it — so the
# kill is sent to a process group rather than a pid. `kill(2)` with a negative
# pid is the only way to say that, and std does not expose it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Preview dialog was here — objc2, objc2-app-kit and objc2-foundation, for
# an NSAlert with a scrolling accessory view showing the Fence hunks.
#
# It is gone with the escalation it gated: a Preview is confined by the live
# tree's policy now, so there is nothing to approve
# (docs/adr/0019-a-preview-is-confined-by-the-live-trees-policy.md). Nothing
# else in this host draws AppKit directly, so the direct dependencies went too —
# tauri's macOS backend still pulls the same crates, which is why they cost
# nothing to name and also nothing to stop naming.
