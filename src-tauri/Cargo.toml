[package]
name = "varnick"
version = "0.0.0"
description = "A desktop harness for a coding agent"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "varnick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
