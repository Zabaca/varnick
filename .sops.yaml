# sops creation rules. The Secrets file holds the Credential and nothing else
# (ADR-0005); `age` is the only key provider.
creation_rules:
  # The test fixture, encrypted to the throwaway key committed beside it. Never
  # holds a real Credential.
  - path_regex: src/host/testdata/secrets.*\.yaml$
    age: age1st8drx5plcd6k8uykcdpqm4wdtlc39r8h3tgwx4caev0xeudu37sg7exwu

  # The real Secrets file, encrypted to the developer's age identities from
  # `~/.config/sops/age/keys.txt`; either one decrypts it.
  - path_regex: ^secrets\.yaml$
    age: >-
      age1cq0k9s88fmx7kkaqqvuf290lelyt8gkeglwvsd2r3ezuqyla7aps7x4q2j,
      age1mkwj9hhvaer3ks5rd0ujzvmzwq56vdwlzruy2pld4zm6r73jl40qg4p343
