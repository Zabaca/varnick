<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Voice spike</title>
<style>
  :root { --bg: #111; --text: #e8e8e8; --muted: #9a9a9a; --line: #3a3a3a; --button: #2a2a2a; --on: #1f6f3f; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f5f4; --text: #1d1d1b; --muted: #666; --line: #cfcfcb; --button: #ececea; --on: #bfe6cb; } }
  * { box-sizing: border-box; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 40rem; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  button, input { font: inherit; color: var(--text); background: var(--button); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-height: 44px; }
  input { flex: 1; min-width: 8rem; }
  button[aria-pressed="true"] { background: var(--on); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 12px 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  pre { font: 12px/1.35 ui-monospace, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; height: 14rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<script type="module" src="/voice-spike.js"></script>
</head>
<body>
<h1>Voice spike</h1>
<p class="muted">A throwaway test for Voice mode. It logs levels, visibility and timings to the host, never audio. Run <span id="run">-</span>.</p>

<div class="row">
  <button id="mic" type="button" aria-pressed="false">Start microphone</button>
  <button id="wake" type="button" aria-pressed="false">Wake lock</button>
</div>
<div class="row">
  <button id="tone-ctx" type="button" aria-pressed="false">Tone: Web Audio</button>
  <button id="tone-audio" type="button" aria-pressed="false">Tone: audio element</button>
</div>
<div class="row">
  <input id="label" type="text" maxlength="40" placeholder="Label for a mark, e.g. lock-30s-notone" autocomplete="off" autocapitalize="off">
  <button id="mark" type="button">Mark</button>
</div>

<dl>
  <dt>Page</dt><dd id="vis">-</dd>
  <dt>Microphone</dt><dd id="mic-state">off</dd>
  <dt>Last level</dt><dd id="level">-</dd>
  <dt>Websocket</dt><dd id="ws">-</dd>
  <dt>Last round trip</dt><dd id="rtt">-</dd>
  <dt>Wake lock</dt><dd id="wake-state">off</dd>
  <dt>Tone</dt><dd id="tone-state">off</dd>
  <dt>Waiting to send</dt><dd id="queued">0</dd>
</dl>
<pre id="tail" aria-live="off"></pre>
</body>
</html>
